<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Z-Anatomy 3D Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8FAFC;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 10;
      transition: opacity 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(13, 148, 136, 0.2);
      border-top-color: #0D9488;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
  </style>
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="GLTFLoader.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading Z-Anatomy 3D Model...</div>
  </div>
  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls, modelGroup;
    let raycaster, mouse;
    let toolMode = 'ROTATE'; // 'ROTATE', 'PAINT', 'ERASE'
    let brushIntensity = 5;
    let activePainMap = {}; // regionName -> intensity
    const meshRegionMap = new Map(); // mesh -> AnatomicalRegion
    const originalMaterials = new Map();

    const SEVERITY_COLORS = {
      low: 0x10B981,      // Green (1-3)
      medium: 0xF59E0B,   // Amber (4-6)
      high: 0xF97316,     // Coral Orange (7-8)
      critical: 0xEF4444  // Crimson Red (9-10)
    };

    function init() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      // 1. Scene & Camera
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xF8FAFC);

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      camera.position.set(0, 0.9, 2.2);

      // 2. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 3. Orbit Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 0.85, 0);
      controls.minDistance = 0.6;
      controls.maxDistance = 4.0;
      controls.maxPolarAngle = Math.PI * 0.95;
      controls.minPolarAngle = Math.PI * 0.05;

      // 4. Studio PBR Lighting Setup
      const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.9);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.4);
      keyLight.position.set(3, 4, 3);
      keyLight.castShadow = true;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0x93C5FD, 0.8);
      fillLight.position.set(-3, 2, 2);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0x0D9488, 0.9);
      rimLight.position.set(0, 3, -3);
      scene.add(rimLight);

      const bottomLight = new THREE.DirectionalLight(0xE2E8F0, 0.4);
      bottomLight.position.set(0, -3, 0);
      scene.add(bottomLight);

      // 5. Raycasting Setup
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // 6. Load Z-Anatomy Model
      loadZAnatomyModel();

      // 7. Event Listeners
      window.addEventListener('resize', onWindowResize);
      setupTouchInteractions();

      animate();
    }

    function loadZAnatomyModel() {
      const loader = new THREE.GLTFLoader();
      const modelPath = '../models/z_anatomy_fullbody.glb';

      loader.load(
        modelPath,
        (gltf) => {
          modelGroup = gltf.scene;

          // Compute bounding box and center model
          const box = new THREE.Box3().setFromObject(modelGroup);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          // Normalize scale to fit viewport height (~1.7 units)
          const maxDim = Math.max(size.x, size.y, size.z);
          const targetScale = 1.70 / (maxDim || 1.70);
          modelGroup.scale.setScalar(targetScale);

          // Center at origin
          modelGroup.position.x = -center.x * targetScale;
          modelGroup.position.y = -center.y * targetScale + 0.85;
          modelGroup.position.z = -center.z * targetScale;

          // Process individual muscle meshes
          modelGroup.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;

              // Medical Atlas Muscular PBR Material
              const defaultMat = new THREE.MeshStandardMaterial({
                color: 0x94A3B8,
                roughness: 0.45,
                metalness: 0.15,
                side: THREE.DoubleSide
              });
              originalMaterials.set(child, defaultMat);
              child.material = defaultMat;

              // Map mesh name to AnatomicalRegion
              const region = mapMeshNameToRegion(child.name);
              meshRegionMap.set(child, region);
            }
          });

          scene.add(modelGroup);
          hideLoading();
        },
        undefined,
        (error) => {
          console.warn('Primary Z-Anatomy fullbody failed, attempting fallback...', error);
          loadFallbackModel();
        }
      );
    }

    function loadFallbackModel() {
      const loader = new THREE.GLTFLoader();
      loader.load(
        '../models/human_body.glb',
        (gltf) => {
          modelGroup = gltf.scene;
          const box = new THREE.Box3().setFromObject(modelGroup);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          const targetScale = 1.70 / (size.y || 1.70);
          modelGroup.scale.setScalar(targetScale);
          modelGroup.position.x = -center.x * targetScale;
          modelGroup.position.y = -center.y * targetScale + 0.85;
          modelGroup.position.z = -center.z * targetScale;

          modelGroup.traverse((child) => {
            if (child.isMesh) {
              const defaultMat = new THREE.MeshStandardMaterial({
                color: 0x94A3B8,
                roughness: 0.45,
                metalness: 0.15,
                side: THREE.DoubleSide
              });
              originalMaterials.set(child, defaultMat);
              child.material = defaultMat;
              meshRegionMap.set(child, 'LOWER_BACK_LUMBAR');
            }
          });

          scene.add(modelGroup);
          hideLoading();
        },
        undefined,
        (err) => {
          console.error('All GLB models failed to load', err);
          hideLoading();
        }
      );
    }

    function mapMeshNameToRegion(meshName) {
      const n = (meshName || '').toLowerCase();

      // Head & Neck
      if (n.includes('temporalis') || n.includes('frontalis') || n.includes('cranium')) return 'HEAD';
      if (n.includes('masseter') || n.includes('jaw') || n.includes('pterygoid')) return 'JAW_FACIAL';
      if (n.includes('sternocleidomastoid') || n.includes('scalene') || n.includes('cervical')) return 'NECK_CERVICAL';

      // Torso & Spine
      if (n.includes('pectoralis') || n.includes('sternocostal')) return 'CHEST_THORACIC';
      if (n.includes('trapezius') || n.includes('rhomboid') || n.includes('latissimus')) return 'UPPER_BACK';
      if (n.includes('rectus abdominis') || n.includes('oblique') || n.includes('transversus')) return 'ABDOMEN';
      if (n.includes('iliocostalis') || n.includes('longissimus') || n.includes('multifidus') || n.includes('lumbar') || n.includes('erector') || n.includes('spinalis')) {
        return 'LOWER_BACK_LUMBAR';
      }
      if (n.includes('pelvis') || n.includes('sacrum') || n.includes('gluteus medius') || n.includes('gluteus minimus')) return 'PELVIS_HIPS';

      // Upper Limbs
      if (n.includes('deltoid') || n.includes('supraspinatus') || n.includes('infraspinatus') || n.includes('subscapularis')) {
        return (n.includes('.l') || n.includes('left')) ? 'SHOULDER_LEFT' : 'SHOULDER_RIGHT';
      }
      if (n.includes('biceps') || n.includes('brachialis') || n.includes('coracobrachialis') || n.includes('triceps')) {
        return (n.includes('.l') || n.includes('left')) ? 'ARM_UPPER_LEFT' : 'ARM_UPPER_RIGHT';
      }
      if (n.includes('pronator teres') || n.includes('anconeus') || n.includes('elbow')) {
        return (n.includes('.l') || n.includes('left')) ? 'ELBOW_LEFT' : 'ELBOW_RIGHT';
      }
      if (n.includes('flexor') || n.includes('extensor') || n.includes('brachioradialis') || n.includes('supinator') || n.includes('pronator')) {
        return (n.includes('.l') || n.includes('left')) ? 'FOREARM_LEFT' : 'FOREARM_RIGHT';
      }
      if (n.includes('wrist') || n.includes('palmaris') || n.includes('hand') || n.includes('indicis')) {
        return (n.includes('.l') || n.includes('left')) ? 'WRIST_HAND_LEFT' : 'WRIST_HAND_RIGHT';
      }

      // Lower Limbs
      if (n.includes('gluteus maximus') || n.includes('gluteal') || n.includes('piriformis') || n.includes('hip')) {
        return (n.includes('.l') || n.includes('left')) ? 'HIP_LEFT' : 'HIP_RIGHT';
      }
      if (n.includes('rectus femoris') || n.includes('vastus') || n.includes('quadriceps') || n.includes('sartorius')) {
        return (n.includes('.l') || n.includes('left')) ? 'THIGH_QUAD_LEFT' : 'THIGH_QUAD_RIGHT';
      }
      if (n.includes('biceps femoris') || n.includes('semitendinosus') || n.includes('semimembranosus') || n.includes('adductor') || n.includes('gracilis') || n.includes('pectineus')) {
        return (n.includes('.l') || n.includes('left')) ? 'THIGH_QUAD_LEFT' : 'THIGH_QUAD_RIGHT';
      }
      if (n.includes('knee') || n.includes('patella') || n.includes('popliteus')) {
        return (n.includes('.l') || n.includes('left')) ? 'KNEE_LEFT' : 'KNEE_RIGHT';
      }
      if (n.includes('gastrocnemius') || n.includes('soleus') || n.includes('plantaris') || n.includes('tibialis') || n.includes('fibularis')) {
        return (n.includes('.l') || n.includes('left')) ? 'CALF_SHIN_LEFT' : 'CALF_SHIN_RIGHT';
      }
      if (n.includes('ankle') || n.includes('foot') || n.includes('calcaneus') || n.includes('talus')) {
        return (n.includes('.l') || n.includes('left')) ? 'ANKLE_FOOT_LEFT' : 'ANKLE_FOOT_RIGHT';
      }

      return 'LOWER_BACK_LUMBAR';
    }

    function setupTouchInteractions() {
      let touchStartX = 0, touchStartY = 0;
      let isMoved = false;

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          isMoved = false;
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          const dx = Math.abs(e.touches[0].clientX - touchStartX);
          const dy = Math.abs(e.touches[0].clientY - touchStartY);
          if (dx > 8 || dy > 8) isMoved = true;

          if (toolMode === 'PAINT' || toolMode === 'ERASE') {
            handleRaycast(e.touches[0].clientX, e.touches[0].clientY);
          }
        }
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        if (!isMoved && e.changedTouches.length === 1) {
          handleRaycast(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }
      });
    }

    function handleRaycast(clientX, clientY) {
      if (!modelGroup) return;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(modelGroup.children, true);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const region = meshRegionMap.get(hitMesh) || mapMeshNameToRegion(hitMesh.name);

        if (toolMode === 'PAINT') {
          paintRegion(region, brushIntensity);
          if (window.AndroidBridge && window.AndroidBridge.onMeshPainted) {
            window.AndroidBridge.onMeshPainted(region, brushIntensity);
          }
        } else if (toolMode === 'ERASE') {
          eraseRegion(region);
          if (window.AndroidBridge && window.AndroidBridge.onMeshErased) {
            window.AndroidBridge.onMeshErased(region);
          }
        } else {
          if (window.AndroidBridge && window.AndroidBridge.onMeshSelected) {
            window.AndroidBridge.onMeshSelected(region);
          }
        }
      }
    }

    function paintRegion(region, intensity) {
      activePainMap[region] = intensity;
      updateMeshHighlights();
    }

    function eraseRegion(region) {
      delete activePainMap[region];
      updateMeshHighlights();
    }

    function updateMeshHighlights() {
      if (!modelGroup) return;

      modelGroup.traverse((child) => {
        if (child.isMesh) {
          const region = meshRegionMap.get(child) || mapMeshNameToRegion(child.name);
          const intensity = activePainMap[region];

          if (intensity) {
            const hexColor = getSeverityHex(intensity);
            child.material = new THREE.MeshStandardMaterial({
              color: hexColor,
              emissive: hexColor,
              emissiveIntensity: 0.50,
              roughness: 0.35,
              metalness: 0.15,
              side: THREE.DoubleSide
            });
          } else {
            child.material = originalMaterials.get(child) || new THREE.MeshStandardMaterial({
              color: 0x94A3B8,
              roughness: 0.45,
              metalness: 0.15,
              side: THREE.DoubleSide
            });
          }
        }
      });
    }

    function getSeverityHex(intensity) {
      if (intensity <= 3) return SEVERITY_COLORS.low;
      if (intensity <= 6) return SEVERITY_COLORS.medium;
      if (intensity <= 8) return SEVERITY_COLORS.high;
      return SEVERITY_COLORS.critical;
    }

    // Exposed methods for Android Kotlin Bridge
    window.setToolMode = function(mode) {
      toolMode = mode;
      controls.enabled = (mode === 'ROTATE');
    };

    window.setBrushIntensity = function(val) {
      brushIntensity = parseInt(val) || 5;
    };

    window.setCameraPreset = function(preset) {
      if (preset === 'front') {
        camera.position.set(0, 0.9, 2.2);
      } else if (preset === 'back') {
        camera.position.set(0, 0.9, -2.2);
      } else if (preset === 'left') {
        camera.position.set(-2.2, 0.9, 0);
      } else if (preset === 'right') {
        camera.position.set(2.2, 0.9, 0);
      } else {
        camera.position.set(0, 0.9, 2.2);
      }
      controls.target.set(0, 0.85, 0);
      controls.update();
    };

    window.syncPainPoints = function(pointsJson) {
      try {
        const points = JSON.parse(pointsJson);
        activePainMap = {};
        points.forEach(p => {
          activePainMap[p.region] = p.intensity;
        });
        updateMeshHighlights();
      } catch (e) {
        console.error('Failed to sync pain points', e);
      }
    };

    function hideLoading() {
      const loader = document.getElementById('loading-overlay');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 300);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
