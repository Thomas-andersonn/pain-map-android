<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Full-Body 3D Pain Mapper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8FAFC;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 10;
      transition: opacity 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(13, 148, 136, 0.2);
      border-top-color: #0D9488;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
  </style>
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="GLTFLoader.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading Full-Body 3D Anatomy...</div>
  </div>
  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls, bodyMesh, modelGroup;
    let raycaster, mouse;
    let toolMode = 'ROTATE'; // 'ROTATE', 'PAINT', 'ERASE'
    let brushIntensity = 5;
    let brushRadiusPx = 22; // Pinpoint localized brush radius
    let paintCanvas, paintCtx, paintTexture;
    const CANVAS_SIZE = 1024;
    const activePainRegions = new Map(); // region -> intensity

    const SEVERITY_COLORS = {
      low: { hex: '#10B981', rgb: 'rgba(16, 185, 129,' },
      medium: { hex: '#F59E0B', rgb: 'rgba(245, 158, 11,' },
      high: { hex: '#F97316', rgb: 'rgba(249, 115, 22,' },
      critical: { hex: '#EF4444', rgb: 'rgba(239, 68, 68,' }
    };

    function init() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      // 1. Scene & Camera
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xF8FAFC);

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      camera.position.set(0, 0.9, 2.3);

      // 2. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 3. Orbit Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 0.85, 0);
      controls.minDistance = 0.5;
      controls.maxDistance = 4.5;
      controls.maxPolarAngle = Math.PI * 0.95;
      controls.minPolarAngle = Math.PI * 0.05;

      // 4. Studio PBR Lighting
      const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.9);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.4);
      keyLight.position.set(3, 4, 3);
      keyLight.castShadow = true;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0x93C5FD, 0.8);
      fillLight.position.set(-3, 2, 2);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0x0D9488, 0.9);
      rimLight.position.set(0, 3, -3);
      scene.add(rimLight);

      const bottomLight = new THREE.DirectionalLight(0xE2E8F0, 0.4);
      bottomLight.position.set(0, -3, 0);
      scene.add(bottomLight);

      // 5. Dynamic UV Texture Canvas Setup
      setupPaintCanvas();

      // 6. Raycasting Setup
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // 7. Load Full-Body (Head-to-Toe) Model
      loadFullBodyModel();

      // 8. Event Listeners
      window.addEventListener('resize', onWindowResize);
      setupTouchInteractions();

      animate();
    }

    function setupPaintCanvas() {
      paintCanvas = document.createElement('canvas');
      paintCanvas.width = CANVAS_SIZE;
      paintCanvas.height = CANVAS_SIZE;
      paintCtx = paintCanvas.getContext('2d');
      paintCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      paintTexture = new THREE.CanvasTexture(paintCanvas);
      paintTexture.minFilter = THREE.LinearFilter;
      paintTexture.magFilter = THREE.LinearFilter;
      paintTexture.generateMipmaps = false;
    }

    function loadFullBodyModel() {
      const loader = new THREE.GLTFLoader();
      const modelPath = '../models/human_body.glb';

      loader.load(
        modelPath,
        (gltf) => {
          modelGroup = gltf.scene;

          // Compute bounding box and normalize scale to fit complete figure from head to toe (~1.75 units)
          const box = new THREE.Box3().setFromObject(modelGroup);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          const targetScale = 1.72 / (size.y || 1.72);
          modelGroup.scale.setScalar(targetScale);

          // Center model at origin
          modelGroup.position.x = -center.x * targetScale;
          modelGroup.position.y = -center.y * targetScale + 0.85;
          modelGroup.position.z = -center.z * targetScale;

          modelGroup.traverse((child) => {
            if (child.isMesh) {
              bodyMesh = child;
              child.castShadow = true;
              child.receiveShadow = true;

              // Medical Atlas PBR Material with Dynamic UV Emissive Paint Map
              child.material = new THREE.MeshStandardMaterial({
                color: 0x94A3B8,
                roughness: 0.45,
                metalness: 0.15,
                emissiveMap: paintTexture,
                emissive: new THREE.Color(0xFFFFFF),
                emissiveIntensity: 1.0,
                side: THREE.DoubleSide
              });
            }
          });

          scene.add(modelGroup);
          hideLoading();
        },
        undefined,
        (error) => {
          console.error('Failed to load full body model:', error);
          hideLoading();
        }
      );
    }

    function setupTouchInteractions() {
      let touchStartX = 0, touchStartY = 0;
      let isMoved = false;

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          isMoved = false;
          if (toolMode === 'PAINT' || toolMode === 'ERASE') {
            handleRaycast(e.touches[0].clientX, e.touches[0].clientY);
          }
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          const dx = Math.abs(e.touches[0].clientX - touchStartX);
          const dy = Math.abs(e.touches[0].clientY - touchStartY);
          if (dx > 6 || dy > 6) isMoved = true;

          if (toolMode === 'PAINT' || toolMode === 'ERASE') {
            handleRaycast(e.touches[0].clientX, e.touches[0].clientY);
          }
        }
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        if (!isMoved && e.changedTouches.length === 1) {
          handleRaycast(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }
      });
    }

    function handleRaycast(clientX, clientY) {
      if (!bodyMesh) return;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(bodyMesh, true);

      if (intersects.length > 0) {
        const hit = intersects[0];
        const uv = hit.uv;
        const hitPoint = hit.point;

        // Map 3D hit point coordinate to AnatomicalRegion
        const region = mapCoordinateToAnatomicalRegion(hitPoint.x, hitPoint.y, hitPoint.z);

        if (uv) {
          const cx = uv.x * CANVAS_SIZE;
          const cy = (1 - uv.y) * CANVAS_SIZE;

          if (toolMode === 'PAINT') {
            drawPaintSpot(cx, cy, brushIntensity);
            activePainRegions.set(region, brushIntensity);
            if (window.AndroidBridge && window.AndroidBridge.onMeshPainted) {
              window.AndroidBridge.onMeshPainted(region, brushIntensity);
            }
          } else if (toolMode === 'ERASE') {
            drawEraseSpot(cx, cy);
            activePainRegions.delete(region);
            if (window.AndroidBridge && window.AndroidBridge.onMeshErased) {
              window.AndroidBridge.onMeshErased(region);
            }
          } else {
            if (window.AndroidBridge && window.AndroidBridge.onMeshSelected) {
              window.AndroidBridge.onMeshSelected(region);
            }
          }
        }
      }
    }

    function drawPaintSpot(x, y, intensity) {
      const color = getSeverityColor(intensity);
      const rad = brushRadiusPx;

      paintCtx.globalCompositeOperation = 'source-over';
      const grad = paintCtx.createRadialGradient(x, y, 0, x, y, rad);
      grad.addColorStop(0, color.rgb + '0.95)');
      grad.addColorStop(0.6, color.rgb + '0.75)');
      grad.addColorStop(1, color.rgb + '0.0)');

      paintCtx.fillStyle = grad;
      paintCtx.beginPath();
      paintCtx.arc(x, y, rad, 0, Math.PI * 2);
      paintCtx.fill();

      paintTexture.needsUpdate = true;
    }

    function drawEraseSpot(x, y) {
      const rad = brushRadiusPx * 1.5;
      paintCtx.globalCompositeOperation = 'destination-out';
      paintCtx.beginPath();
      paintCtx.arc(x, y, rad, 0, Math.PI * 2);
      paintCtx.fill();

      paintTexture.needsUpdate = true;
    }

    function getSeverityColor(intensity) {
      if (intensity <= 3) return SEVERITY_COLORS.low;
      if (intensity <= 6) return SEVERITY_COLORS.medium;
      if (intensity <= 8) return SEVERITY_COLORS.high;
      return SEVERITY_COLORS.critical;
    }

    /**
     * Maps 3D spatial coordinates on the normalized full-body avatar (Y: 0.0 to 1.70)
     * to clinical AnatomicalRegion.
     */
    function mapCoordinateToAnatomicalRegion(x, y, z) {
      const isLeft = (x > 0.005);
      const isBack = (z < 0.0);

      // Head & Face & TMJ (Y: 1.50 - 1.75)
      if (y >= 1.50) {
        if (!isBack && y < 1.58) return 'JAW_FACIAL';
        return 'HEAD';
      }

      // Neck & Cervical Spine (Y: 1.38 - 1.50)
      if (y >= 1.38) return 'NECK_CERVICAL';

      // Upper Torso / Shoulders / Chest (Y: 1.15 - 1.38)
      if (y >= 1.15) {
        if (Math.abs(x) > 0.16) {
          return isLeft ? 'SHOULDER_LEFT' : 'SHOULDER_RIGHT';
        }
        return isBack ? 'UPPER_BACK' : 'CHEST_THORACIC';
      }

      // Mid Torso / Abdomen / Lumbar Spine / Arms (Y: 0.90 - 1.15)
      if (y >= 0.90) {
        if (Math.abs(x) > 0.18) {
          return isLeft ? 'ARM_UPPER_LEFT' : 'ARM_UPPER_RIGHT';
        }
        return isBack ? 'LOWER_BACK_LUMBAR' : 'ABDOMEN';
      }

      // Pelvis / Hips / Forearms (Y: 0.72 - 0.90)
      if (y >= 0.72) {
        if (Math.abs(x) > 0.19) {
          return isLeft ? 'FOREARM_LEFT' : 'FOREARM_RIGHT';
        }
        return isLeft ? 'HIP_LEFT' : 'HIP_RIGHT';
      }

      // Thighs / Quads / Hamstrings / Hands (Y: 0.45 - 0.72)
      if (y >= 0.45) {
        if (Math.abs(x) > 0.20 && y > 0.60) {
          return isLeft ? 'WRIST_HAND_LEFT' : 'WRIST_HAND_RIGHT';
        }
        return isLeft ? 'THIGH_QUAD_LEFT' : 'THIGH_QUAD_RIGHT';
      }

      // Knees (Y: 0.35 - 0.45)
      if (y >= 0.35) {
        return isLeft ? 'KNEE_LEFT' : 'KNEE_RIGHT';
      }

      // Calves / Shins / Achilles (Y: 0.14 - 0.35)
      if (y >= 0.14) {
        return isLeft ? 'CALF_SHIN_LEFT' : 'CALF_SHIN_RIGHT';
      }

      // Ankles / Feet / Plantar Fascia / Toes (Y < 0.14)
      return isLeft ? 'ANKLE_FOOT_LEFT' : 'ANKLE_FOOT_RIGHT';
    }

    // Exposed methods for Android Kotlin Bridge
    window.setToolMode = function(mode) {
      toolMode = mode;
      controls.enabled = (mode === 'ROTATE');
    };

    window.setBrushIntensity = function(val) {
      brushIntensity = parseInt(val) || 5;
    };

    window.setBrushRadius = function(val) {
      brushRadiusPx = parseInt(val) || 22;
    };

    window.setCameraPreset = function(preset) {
      if (preset === 'front') {
        camera.position.set(0, 0.9, 2.3);
        controls.target.set(0, 0.85, 0);
      } else if (preset === 'back') {
        camera.position.set(0, 0.9, -2.3);
        controls.target.set(0, 0.85, 0);
      } else if (preset === 'head_neck') {
        camera.position.set(0, 1.50, 0.9);
        controls.target.set(0, 1.50, 0);
      } else if (preset === 'torso_spine') {
        camera.position.set(0, 1.05, 1.2);
        controls.target.set(0, 1.05, 0);
      } else if (preset === 'legs_feet') {
        camera.position.set(0, 0.40, 1.3);
        controls.target.set(0, 0.35, 0);
      } else {
        camera.position.set(0, 0.9, 2.3);
        controls.target.set(0, 0.85, 0);
      }
      controls.update();
    };

    window.clearAllPaint = function() {
      paintCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      paintTexture.needsUpdate = true;
      activePainRegions.clear();
    };

    function hideLoading() {
      const loader = document.getElementById('loading-overlay');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 300);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
