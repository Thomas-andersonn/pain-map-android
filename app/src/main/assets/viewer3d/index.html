<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Full-Body 3D Pain Mapper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8FAFC;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 10;
      transition: opacity 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(13, 148, 136, 0.2);
      border-top-color: #0D9488;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
  </style>
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="GLTFLoader.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading Full-Body 3D Anatomy...</div>
  </div>
  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls, bodyMesh, modelGroup;
    let raycaster, mouse;
    let interactionMode = 'ORBIT'; // 'ORBIT' (Tap & Drag to rotate) or 'STROKE' (Continuous paint stroke)
    let brushIntensity = 5;
    const BASE_BRUSH_RADIUS = 24;
    let paintCanvas, paintCtx, paintTexture;
    const CANVAS_SIZE = 1024;
    
    // Spatial index of active painted spots
    let paintedSpots = [];
    
    // Camera animation state
    let targetCamPos = null;
    let targetControlsTarget = null;
    let animProgress = 1.0;

    const SEVERITY_COLORS = {
      low: { hex: '#10B981', rgb: 'rgba(16, 185, 129,' },
      medium: { hex: '#F59E0B', rgb: 'rgba(245, 158, 11,' },
      high: { hex: '#F97316', rgb: 'rgba(249, 115, 22,' },
      critical: { hex: '#EF4444', rgb: 'rgba(239, 68, 68,' }
    };

    function init() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      // 1. Scene & Camera
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xF8FAFC);

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      camera.position.set(0, 0.9, 2.3);

      // 2. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 3. Orbit Controls with Centering & Constraints
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 0.85, 0);
      controls.minDistance = 0.45; // Close-up macro inspection
      controls.maxDistance = 4.0;
      controls.maxPolarAngle = Math.PI - 0.05;
      controls.minPolarAngle = 0.05;

      // 4. Studio Lighting
      const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.85);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.2);
      keyLight.position.set(2, 4, 3);
      keyLight.castShadow = true;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0x94A3B8, 0.6);
      fillLight.position.set(-3, 2, -2);
      scene.add(fillLight);

      const backLight = new THREE.DirectionalLight(0x0D9488, 0.4);
      backLight.position.set(0, 3, -3);
      scene.add(backLight);

      // 5. Dynamic UV Paint Texture Canvas
      paintCanvas = document.createElement('canvas');
      paintCanvas.width = CANVAS_SIZE;
      paintCanvas.height = CANVAS_SIZE;
      paintCtx = paintCanvas.getContext('2d');
      paintCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      paintTexture = new THREE.CanvasTexture(paintCanvas);
      paintTexture.minFilter = THREE.LinearFilter;
      paintTexture.magFilter = THREE.LinearFilter;

      // 6. Raycaster
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // 7. Load GLTF Anatomical Model
      loadAnatomicalModel();

      // 8. Event Listeners
      setupUnifiedTouchEngine();
      window.addEventListener('resize', onWindowResize);

      // 9. Start Animation Loop
      animate();
    }

    function loadAnatomicalModel() {
      const loader = new THREE.GLTFLoader();
      loader.load(
        '/assets/models/human_body.glb',
        (gltf) => {
          modelGroup = gltf.scene;

          const box = new THREE.Box3().setFromObject(modelGroup);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          const targetScale = 1.70 / size.y;
          modelGroup.scale.set(targetScale, targetScale, targetScale);
          modelGroup.rotation.y = -Math.PI / 2;
          modelGroup.position.y = -box.min.y * targetScale;
          modelGroup.position.x = -center.z * targetScale;
          modelGroup.position.z = center.x * targetScale;

          modelGroup.traverse((child) => {
            if (child.isMesh) {
              bodyMesh = child;
              child.castShadow = true;
              child.receiveShadow = true;

              child.material = new THREE.MeshStandardMaterial({
                color: 0x94A3B8,
                roughness: 0.45,
                metalness: 0.15,
                emissiveMap: paintTexture,
                emissive: new THREE.Color(0xFFFFFF),
                emissiveIntensity: 1.0,
                side: THREE.DoubleSide
              });
            }
          });

          scene.add(modelGroup);
          hideLoading();

          if (window.AndroidBridge && window.AndroidBridge.onModelReady) {
            window.AndroidBridge.onModelReady();
          }
        },
        undefined,
        (error) => {
          console.error('Failed to load full body model:', error);
          hideLoading();
        }
      );
    }

    /**
     * Compute current zoom-scaled brush radius in UV canvas pixels.
     * When zoomed in close, brush shrinks proportionally for micro-precision.
     */
    function getDynamicBrushRadius() {
      const dist = camera.position.distanceTo(controls.target);
      const zoomFactor = Math.min(Math.max(dist / 2.3, 0.20), 1.25);
      return Math.round(BASE_BRUSH_RADIUS * zoomFactor);
    }

    /**
     * Unified Touch Engine:
     * - Pinch: Raycasts to pinch midpoint so zooming focuses directly on touched joint
     * - Double-Tap: Smoothly centers camera and zooms into the tapped joint
     * - Tap: Paints localized spot / Re-tap erases spot
     * - Drag in ORBIT mode: 360° rotation
     * - Drag in STROKE mode: Continuous multi-section fluid stroke painting
     */
    function setupUnifiedTouchEngine() {
      let touchStartX = 0, touchStartY = 0;
      let touchStartTime = 0;
      let lastTapTime = 0;
      let lastTapX = 0, lastTapY = 0;
      let isDragging = false;

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = performance.now();
          isDragging = false;
        } else if (e.touches.length === 2) {
          const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          focusTargetAtScreenPoint(midX, midY, false);
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          const dx = e.touches[0].clientX - touchStartX;
          const dy = e.touches[0].clientY - touchStartY;
          if (Math.hypot(dx, dy) > 8) {
            isDragging = true;
          }

          if (interactionMode === 'STROKE' && isDragging) {
            e.preventDefault();
            paintAtScreenPoint(e.touches[0].clientX, e.touches[0].clientY);
          }
        }
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        const touchDuration = performance.now() - touchStartTime;
        const now = performance.now();

        if (!isDragging && touchDuration < 350) {
          const tapX = touchStartX;
          const tapY = touchStartY;

          if (now - lastTapTime < 300 && Math.hypot(tapX - lastTapX, tapY - lastTapY) < 25) {
            focusTargetAtScreenPoint(tapX, tapY, true);
            lastTapTime = 0;
          } else {
            lastTapTime = now;
            lastTapX = tapX;
            lastTapY = tapY;
            handleSingleTap(tapX, tapY);
          }
        }
      }, { passive: false });

      // Fallback Mouse Support for Emulator
      let isMouseDown = false;
      let mouseDownTime = 0;
      let mouseStartX = 0, mouseStartY = 0;

      window.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        mouseDownTime = performance.now();
        mouseStartX = e.clientX;
        mouseStartY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (isMouseDown && interactionMode === 'STROKE') {
          const dist = Math.hypot(e.clientX - mouseStartX, e.clientY - mouseStartY);
          if (dist > 6) {
            paintAtScreenPoint(e.clientX, e.clientY);
          }
        }
      });

      window.addEventListener('mouseup', (e) => {
        isMouseDown = false;
        const duration = performance.now() - mouseDownTime;
        const dist = Math.hypot(e.clientX - mouseStartX, e.clientY - mouseStartY);

        if (dist < 10 && duration < 350) {
          handleSingleTap(e.clientX, e.clientY);
        }
      });
    }

    function handleSingleTap(clientX, clientY) {
      if (!bodyMesh) return;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(bodyMesh, true);

      if (intersects.length > 0) {
        const hit = intersects[0];
        const uv = hit.uv;
        const hitPoint = hit.point;

        if (uv) {
          const cx = uv.x * CANVAS_SIZE;
          const cy = (1 - uv.y) * CANVAS_SIZE;
          const currentRadius = getDynamicBrushRadius();
          const region = mapCoordinateToAnatomicalRegion(hitPoint.x, hitPoint.y, hitPoint.z);

          // Check if tapping existing spot (Toggle Erase)
          const existingSpotIndex = paintedSpots.findIndex(spot => {
            const d = Math.hypot(spot.cx - cx, spot.cy - cy);
            return d < (spot.radius * 1.35);
          });

          if (existingSpotIndex !== -1) {
            // Re-tap on existing spot -> TOGGLE ERASE
            const erasedSpot = paintedSpots[existingSpotIndex];
            paintedSpots.splice(existingSpotIndex, 1);
            redrawCanvas();

            if (window.AndroidBridge && window.AndroidBridge.onMeshErased) {
              window.AndroidBridge.onMeshErased(erasedSpot.region);
            }
          } else {
            // Tap on clean skin -> PAINT NEW SPOT with Zoom-Invariant precision
            const newSpot = {
              id: Date.now() + Math.random(),
              cx: cx,
              cy: cy,
              intensity: brushIntensity,
              region: region,
              radius: currentRadius
            };
            paintedSpots.push(newSpot);
            renderSpotOnCanvas(newSpot);

            if (window.AndroidBridge && window.AndroidBridge.onMeshPainted) {
              window.AndroidBridge.onMeshPainted(region, brushIntensity, uv.x, uv.y, hitPoint.x, hitPoint.y, hitPoint.z);
            }
          }
        }
      }
    }

    function paintAtScreenPoint(clientX, clientY) {
      if (!bodyMesh) return;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(bodyMesh, true);

      if (intersects.length > 0) {
        const hit = intersects[0];
        const uv = hit.uv;
        const hitPoint = hit.point;

        if (uv) {
          const cx = uv.x * CANVAS_SIZE;
          const cy = (1 - uv.y) * CANVAS_SIZE;
          const currentRadius = getDynamicBrushRadius();
          const region = mapCoordinateToAnatomicalRegion(hitPoint.x, hitPoint.y, hitPoint.z);

          const newSpot = {
            id: Date.now() + Math.random(),
            cx: cx,
            cy: cy,
            intensity: brushIntensity,
            region: region,
            radius: currentRadius
          };
          paintedSpots.push(newSpot);
          renderSpotOnCanvas(newSpot);

          if (window.AndroidBridge && window.AndroidBridge.onMeshPainted) {
            window.AndroidBridge.onMeshPainted(region, brushIntensity, uv.x, uv.y, hitPoint.x, hitPoint.y, hitPoint.z);
          }
        }
      }
    }

    /**
     * Focuses controls.target directly onto the touched 3D surface point
     */
    function focusTargetAtScreenPoint(clientX, clientY, animateZoom) {
      if (!bodyMesh) return;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(bodyMesh, true);

      if (intersects.length > 0) {
        const hitPoint = intersects[0].point;

        if (animateZoom) {
          targetControlsTarget = new THREE.Vector3(hitPoint.x, hitPoint.y, hitPoint.z);
          
          const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
          targetCamPos = new THREE.Vector3().addVectors(targetControlsTarget, dir.multiplyScalar(0.95));
          animProgress = 0.0;
        } else {
          controls.target.lerp(new THREE.Vector3(hitPoint.x, hitPoint.y, hitPoint.z), 0.35);
        }
      }
    }

    function renderSpotOnCanvas(spot) {
      const color = getSeverityColor(spot.intensity);
      const rad = spot.radius;

      paintCtx.globalCompositeOperation = 'source-over';
      const grad = paintCtx.createRadialGradient(spot.cx, spot.cy, 0, spot.cx, spot.cy, rad);
      grad.addColorStop(0, color.rgb + '0.95)');
      grad.addColorStop(0.5, color.rgb + '0.75)');
      grad.addColorStop(1, color.rgb + '0.0)');

      paintCtx.fillStyle = grad;
      paintCtx.beginPath();
      paintCtx.arc(spot.cx, spot.cy, rad, 0, Math.PI * 2);
      paintCtx.fill();

      paintTexture.needsUpdate = true;
    }

    function redrawCanvas() {
      paintCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      for (const spot of paintedSpots) {
        renderSpotOnCanvas(spot);
      }
      paintTexture.needsUpdate = true;
    }

    function getSeverityColor(intensity) {
      if (intensity <= 3) return SEVERITY_COLORS.low;
      if (intensity <= 6) return SEVERITY_COLORS.medium;
      if (intensity <= 8) return SEVERITY_COLORS.high;
      return SEVERITY_COLORS.critical;
    }

    /**
     * Maps 3D spatial coordinates on the normalized full-body avatar (Y: 0.0 to 1.70)
     * to clinical AnatomicalRegion.
     */
    function mapCoordinateToAnatomicalRegion(x, y, z) {
      // Viewer perspective: x < -0.005 is Left, x > 0.005 is Right
      const isLeft = (x < -0.005);
      const isBack = (z < 0.0);

      // Head & Face & TMJ (Y: 1.50 - 1.75)
      if (y >= 1.50) {
        if (!isBack && y < 1.58) return 'JAW_FACIAL';
        return 'HEAD';
      }

      // Neck & Cervical Spine (Y: 1.40 - 1.50)
      if (y >= 1.40) return 'NECK_CERVICAL';

      // Upper Torso / Shoulders / Chest (Y: 1.18 - 1.40)
      if (y >= 1.18) {
        if (Math.abs(x) > 0.16) {
          return isLeft ? 'SHOULDER_LEFT' : 'SHOULDER_RIGHT';
        }
        return isBack ? 'UPPER_BACK' : 'CHEST_THORACIC';
      }

      // Mid Torso / Abdomen / Lumbar Spine / Arms (Y: 0.90 - 1.18)
      if (y >= 0.90) {
        if (Math.abs(x) > 0.18) {
          if (y < 1.05) {
            return isLeft ? 'FOREARM_LEFT' : 'FOREARM_RIGHT';
          }
          return isLeft ? 'ARM_UPPER_LEFT' : 'ARM_UPPER_RIGHT';
        }
        if (isBack) {
          return 'LOWER_BACK_LUMBAR';
        }
        return y > 1.02 ? 'ABDOMEN' : 'PELVIS_HIPS';
      }

      // Pelvis / Hips / Hands (Y: 0.76 - 0.90)
      if (y >= 0.76) {
        if (Math.abs(x) > 0.22) {
          return isLeft ? 'WRIST_HAND_LEFT' : 'WRIST_HAND_RIGHT';
        }
        return isLeft ? 'HIP_LEFT' : 'HIP_RIGHT';
      }

      // Thighs / Quads / Hamstrings (Y: 0.54 - 0.76)
      if (y >= 0.54) {
        return isLeft ? 'THIGH_QUAD_LEFT' : 'THIGH_QUAD_RIGHT';
      }

      // Knees / Patella / Popliteal Fossa (Y: 0.44 - 0.54)
      if (y >= 0.44) {
        return isLeft ? 'KNEE_LEFT' : 'KNEE_RIGHT';
      }

      // Calves / Shins / Achilles Tendon (Y: 0.10 - 0.44)
      if (y >= 0.10) {
        return isLeft ? 'CALF_SHIN_LEFT' : 'CALF_SHIN_RIGHT';
      }

      // Ankles / Feet / Plantar Fascia / Toes (Y < 0.10)
      return isLeft ? 'ANKLE_FOOT_LEFT' : 'ANKLE_FOOT_RIGHT';
    }

    /**
     * Finds UV coordinate on the 3D body mesh for a given 3D anatomical position (x, y, z)
     */
    function findUvForRegion(regionName, x, y, z) {
      if (!bodyMesh) return null;

      const testZ = (z !== undefined && z !== null && !isNaN(z)) ? z : 0.0;
      const testY = (y !== undefined && y !== null && !isNaN(y)) ? y : 1.0;
      const testX = (x !== undefined && x !== null && !isNaN(x)) ? x : 0.0;

      const isBack = testZ < 0;
      const originZ = isBack ? -2.0 : 2.0;

      const origin = new THREE.Vector3(testX, testY, originZ);
      const target = new THREE.Vector3(testX, testY, testZ);
      const dir = new THREE.Vector3().subVectors(target, origin).normalize();

      const ray = new THREE.Raycaster(origin, dir);
      const hits = ray.intersectObject(bodyMesh, true);
      if (hits.length > 0 && hits[0].uv) {
        return hits[0].uv;
      }

      // Try reverse side ray
      const revRay = new THREE.Raycaster(new THREE.Vector3(testX, testY, -originZ), new THREE.Vector3(0, 0, originZ > 0 ? 1 : -1));
      const revHits = revRay.intersectObject(bodyMesh, true);
      if (revHits.length > 0 && revHits[0].uv) {
        return revHits[0].uv;
      }

      return null;
    }

    // Exposed methods for Android Kotlin Bridge
    window.captureMapSnapshot = function() {
      if (!renderer || !scene || !camera) return null;
      try {
        renderer.render(scene, camera);
        const dataUrl = renderer.domElement.toDataURL('image/jpeg', 0.85);
        if (window.AndroidBridge && window.AndroidBridge.onSnapshotCaptured) {
          window.AndroidBridge.onSnapshotCaptured(dataUrl);
        }
        return dataUrl;
      } catch (err) {
        console.error('Error capturing snapshot:', err);
        return null;
      }
    };

    window.restorePaintedPoints = function(pointsJson) {
      if (!bodyMesh || !paintCtx) return;
      try {
        const points = typeof pointsJson === 'string' ? JSON.parse(pointsJson) : pointsJson;
        if (!Array.isArray(points)) return;

        paintedSpots = [];
        paintCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        for (const pt of points) {
          let cx = null;
          let cy = null;

          if (pt.uvX !== undefined && pt.uvX !== null && !isNaN(pt.uvX) &&
              pt.uvY !== undefined && pt.uvY !== null && !isNaN(pt.uvY)) {
            cx = pt.uvX * CANVAS_SIZE;
            cy = (1 - pt.uvY) * CANVAS_SIZE;
          } else {
            const uv = findUvForRegion(pt.region, pt.x, pt.y, pt.z);
            if (uv) {
              cx = uv.x * CANVAS_SIZE;
              cy = (1 - uv.y) * CANVAS_SIZE;
            }
          }

          if (cx !== null && cy !== null) {
            const spot = {
              id: pt.id || (Date.now() + Math.random()),
              cx: cx,
              cy: cy,
              intensity: pt.intensity || 5,
              region: pt.region,
              radius: BASE_BRUSH_RADIUS
            };
            paintedSpots.push(spot);
            renderSpotOnCanvas(spot);
          }
        }
        paintTexture.needsUpdate = true;
      } catch (e) {
        console.error("Failed to restore painted points", e);
      }
    };

    window.setInteractionMode = function(mode) {
      interactionMode = mode; // 'ORBIT' or 'STROKE'
      controls.enabled = (mode === 'ORBIT');
    };

    window.setBrushIntensity = function(val) {
      brushIntensity = parseInt(val) || 5;
    };

    window.setCameraPreset = function(preset) {
      animProgress = 1.0;
      if (preset === 'front') {
        camera.position.set(0, 0.9, 2.3);
        controls.target.set(0, 0.85, 0);
      } else if (preset === 'back') {
        camera.position.set(0, 0.9, -2.3);
        controls.target.set(0, 0.85, 0);
      } else if (preset === 'head_neck') {
        camera.position.set(0, 1.50, 0.9);
        controls.target.set(0, 1.50, 0);
      } else if (preset === 'torso_spine') {
        camera.position.set(0, 1.05, 1.2);
        controls.target.set(0, 1.05, 0);
      } else if (preset === 'legs_feet') {
        camera.position.set(0, 0.40, 1.3);
        controls.target.set(0, 0.35, 0);
      } else {
        camera.position.set(0, 0.9, 2.3);
        controls.target.set(0, 0.85, 0);
      }
      controls.update();
    };

    window.clearAllPaint = function() {
      paintedSpots = [];
      paintCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      paintTexture.needsUpdate = true;
    };

    function hideLoading() {
      const loader = document.getElementById('loading-overlay');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 300);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Smooth camera interpolation for double-tap zoom focus
      if (animProgress < 1.0) {
        animProgress += 0.06;
        const t = Math.min(animProgress, 1.0);
        const ease = t * (2 - t); // Ease out quad

        if (targetCamPos) camera.position.lerp(targetCamPos, ease);
        if (targetControlsTarget) controls.target.lerp(targetControlsTarget, ease);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
