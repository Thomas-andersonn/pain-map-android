<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Z-Anatomy 3D Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8FAFC;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 10;
      transition: opacity 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(13, 148, 136, 0.2);
      border-top-color: #0D9488;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
  </style>
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="DRACOLoader.js"></script>
  <script src="GLTFLoader.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading Z-Anatomy Discrete Muscles...</div>
  </div>
  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls, modelGroup;
    let raycaster, mouse;
    let toolMode = 'ROTATE'; // 'ROTATE', 'PAINT', 'ERASE'
    let brushIntensity = 5;
    let activePainMap = {}; // regionName -> intensity
    const meshRegionMap = new Map(); // mesh -> AnatomicalRegion
    const allMeshes = [];

    const SEVERITY_COLORS = {
      low: 0x10B981,      // Green (1-3)
      medium: 0xF59E0B,   // Amber (4-6)
      high: 0xF97316,     // Coral Orange (7-8)
      critical: 0xEF4444  // Crimson Red (9-10)
    };

    function init() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      // 1. Scene & Camera
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xF8FAFC);

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      camera.position.set(0, 0.9, 2.2);

      // 2. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 3. Orbit Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 0.85, 0);
      controls.minDistance = 0.6;
      controls.maxDistance = 4.0;
      controls.maxPolarAngle = Math.PI * 0.95;
      controls.minPolarAngle = Math.PI * 0.05;

      // 4. Studio PBR Lighting
      const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.9);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.4);
      keyLight.position.set(3, 4, 3);
      keyLight.castShadow = true;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0x93C5FD, 0.8);
      fillLight.position.set(-3, 2, 2);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0x0D9488, 0.9);
      rimLight.position.set(0, 3, -3);
      scene.add(rimLight);

      const bottomLight = new THREE.DirectionalLight(0xE2E8F0, 0.4);
      bottomLight.position.set(0, -3, 0);
      scene.add(bottomLight);

      // 5. Raycasting Setup
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // 6. Load Z-Anatomy Model with Draco Decoder
      loadZAnatomyModel();

      // 7. Event Listeners
      window.addEventListener('resize', onWindowResize);
      setupTouchInteractions();

      animate();
    }

    function loadZAnatomyModel() {
      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath('draco/');
      dracoLoader.setDecoderConfig({ type: 'js' });
      dracoLoader.preload();

      const loader = new THREE.GLTFLoader();
      loader.setDRACOLoader(dracoLoader);

      const modelPath = '../models/z_anatomy_fullbody.glb';

      loader.load(
        modelPath,
        (gltf) => {
          modelGroup = gltf.scene;

          // Compute bounding box and center model
          const box = new THREE.Box3().setFromObject(modelGroup);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          // Normalize scale to fit viewport height (~1.7 units)
          const maxDim = Math.max(size.x, size.y, size.z);
          const targetScale = 1.70 / (maxDim || 1.70);
          modelGroup.scale.setScalar(targetScale);

          // Center at origin
          modelGroup.position.x = -center.x * targetScale;
          modelGroup.position.y = -center.y * targetScale + 0.85;
          modelGroup.position.z = -center.z * targetScale;

          // Update world matrix so child world positions are accurate
          modelGroup.updateMatrixWorld(true);

          // Process each individual muscle mesh with independent material
          modelGroup.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;

              // Give each mesh its own independent material instance
              child.material = new THREE.MeshStandardMaterial({
                color: 0x94A3B8,
                roughness: 0.45,
                metalness: 0.15,
                side: THREE.DoubleSide
              });

              // Compute mesh world position to precisely separate Left vs Right limbs
              const worldPos = new THREE.Vector3();
              child.getWorldPosition(worldPos);

              const parentName = child.parent ? child.parent.name : '';
              const nodeName = child.name || parentName;
              const region = mapMeshToAnatomicalRegion(nodeName, parentName, worldPos);

              meshRegionMap.set(child, region);
              allMeshes.push(child);
            }
          });

          scene.add(modelGroup);
          hideLoading();
          updateMeshHighlights();
        },
        undefined,
        (error) => {
          console.error('Error loading Z-Anatomy Draco model:', error);
          hideLoading();
        }
      );
    }

    function mapMeshToAnatomicalRegion(nodeName, parentName, worldPos) {
      const combined = (nodeName + ' ' + parentName).toLowerCase();

      // Determine Left vs Right by explicit node suffix or world X coordinate
      // In anatomical view: X > 0.015 is Left limb, X < -0.015 is Right limb
      const hasLeftIndicator = combined.includes('.l') || combined.includes('left');
      const hasRightIndicator = combined.includes('.r') || combined.includes('right');

      let isLeft = false;
      if (hasLeftIndicator && !hasRightIndicator) {
        isLeft = true;
      } else if (hasRightIndicator && !hasLeftIndicator) {
        isLeft = false;
      } else {
        isLeft = (worldPos.x > 0.01);
      }

      // Head & Neck
      if (combined.includes('temporalis') || combined.includes('frontalis') || combined.includes('cranium') || combined.includes('head')) return 'HEAD';
      if (combined.includes('masseter') || combined.includes('jaw') || combined.includes('pterygoid')) return 'JAW_FACIAL';
      if (combined.includes('sternocleidomastoid') || combined.includes('scalene') || combined.includes('cervical') || combined.includes('neck')) return 'NECK_CERVICAL';

      // Torso & Back
      if (combined.includes('pectoralis') || combined.includes('sternocostal')) return 'CHEST_THORACIC';
      if (combined.includes('trapezius') || combined.includes('rhomboid') || combined.includes('latissimus')) return 'UPPER_BACK';
      if (combined.includes('rectus abdominis') || combined.includes('oblique') || combined.includes('transversus') || combined.includes('abdomen')) return 'ABDOMEN';
      if (combined.includes('iliocostalis') || combined.includes('longissimus') || combined.includes('multifidus') || combined.includes('lumbar') || combined.includes('erector') || combined.includes('spinalis') || combined.includes('quadratus lumborum')) {
        return 'LOWER_BACK_LUMBAR';
      }
      if (combined.includes('pelvis') || combined.includes('sacrum')) return 'PELVIS_HIPS';

      // Shoulder & Arms
      if (combined.includes('deltoid') || combined.includes('supraspinatus') || combined.includes('infraspinatus') || combined.includes('subscapularis') || combined.includes('shoulder')) {
        return isLeft ? 'SHOULDER_LEFT' : 'SHOULDER_RIGHT';
      }
      if (combined.includes('biceps') || combined.includes('brachialis') || combined.includes('coracobrachialis') || combined.includes('triceps')) {
        return isLeft ? 'ARM_UPPER_LEFT' : 'ARM_UPPER_RIGHT';
      }
      if (combined.includes('pronator teres') || combined.includes('anconeus') || combined.includes('elbow')) {
        return isLeft ? 'ELBOW_LEFT' : 'ELBOW_RIGHT';
      }
      if (combined.includes('flexor') || combined.includes('extensor') || combined.includes('brachioradialis') || combined.includes('supinator') || combined.includes('forearm')) {
        return isLeft ? 'FOREARM_LEFT' : 'FOREARM_RIGHT';
      }
      if (combined.includes('wrist') || combined.includes('palmaris') || combined.includes('hand') || combined.includes('indicis')) {
        return isLeft ? 'WRIST_HAND_LEFT' : 'WRIST_HAND_RIGHT';
      }

      // Hips & Legs
      if (combined.includes('gluteus') || combined.includes('gluteal') || combined.includes('piriformis') || combined.includes('hip')) {
        return isLeft ? 'HIP_LEFT' : 'HIP_RIGHT';
      }
      if (combined.includes('rectus femoris') || combined.includes('vastus') || combined.includes('quadriceps') || combined.includes('sartorius') || combined.includes('biceps femoris') || combined.includes('semitendinosus') || combined.includes('semimembranosus') || combined.includes('adductor') || combined.includes('gracilis') || combined.includes('pectineus') || combined.includes('thigh')) {
        return isLeft ? 'THIGH_QUAD_LEFT' : 'THIGH_QUAD_RIGHT';
      }
      if (combined.includes('knee') || combined.includes('patella') || combined.includes('popliteus')) {
        return isLeft ? 'KNEE_LEFT' : 'KNEE_RIGHT';
      }
      if (combined.includes('gastrocnemius') || combined.includes('soleus') || combined.includes('plantaris') || combined.includes('tibialis') || combined.includes('fibularis') || combined.includes('calf')) {
        return isLeft ? 'CALF_SHIN_LEFT' : 'CALF_SHIN_RIGHT';
      }
      if (combined.includes('ankle') || combined.includes('foot') || combined.includes('calcaneus') || combined.includes('talus')) {
        return isLeft ? 'ANKLE_FOOT_LEFT' : 'ANKLE_FOOT_RIGHT';
      }

      return isLeft ? 'THIGH_QUAD_LEFT' : 'THIGH_QUAD_RIGHT';
    }

    function setupTouchInteractions() {
      let touchStartX = 0, touchStartY = 0;
      let isMoved = false;

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          isMoved = false;
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          const dx = Math.abs(e.touches[0].clientX - touchStartX);
          const dy = Math.abs(e.touches[0].clientY - touchStartY);
          if (dx > 8 || dy > 8) isMoved = true;

          if (toolMode === 'PAINT' || toolMode === 'ERASE') {
            handleRaycast(e.touches[0].clientX, e.touches[0].clientY);
          }
        }
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        if (!isMoved && e.changedTouches.length === 1) {
          handleRaycast(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }
      });
    }

    function handleRaycast(clientX, clientY) {
      if (!modelGroup) return;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(allMeshes, true);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const region = meshRegionMap.get(hitMesh);
        if (!region) return;

        if (toolMode === 'PAINT') {
          paintRegion(region, brushIntensity);
          if (window.AndroidBridge && window.AndroidBridge.onMeshPainted) {
            window.AndroidBridge.onMeshPainted(region, brushIntensity);
          }
        } else if (toolMode === 'ERASE') {
          eraseRegion(region);
          if (window.AndroidBridge && window.AndroidBridge.onMeshErased) {
            window.AndroidBridge.onMeshErased(region);
          }
        } else {
          if (window.AndroidBridge && window.AndroidBridge.onMeshSelected) {
            window.AndroidBridge.onMeshSelected(region);
          }
        }
      }
    }

    function paintRegion(region, intensity) {
      activePainMap[region] = intensity;
      updateMeshHighlights();
    }

    function eraseRegion(region) {
      delete activePainMap[region];
      updateMeshHighlights();
    }

    function updateMeshHighlights() {
      if (allMeshes.length === 0) return;

      for (let i = 0; i < allMeshes.length; i++) {
        const mesh = allMeshes[i];
        const region = meshRegionMap.get(mesh);
        const intensity = activePainMap[region];

        if (intensity) {
          const hexColor = getSeverityHex(intensity);
          mesh.material.color.setHex(hexColor);
          mesh.material.emissive.setHex(hexColor);
          mesh.material.emissiveIntensity = 0.55;
          mesh.material.roughness = 0.35;
          mesh.material.metalness = 0.15;
        } else {
          mesh.material.color.setHex(0x94A3B8);
          mesh.material.emissive.setHex(0x000000);
          mesh.material.emissiveIntensity = 0.0;
          mesh.material.roughness = 0.45;
          mesh.material.metalness = 0.15;
        }
      }
    }

    function getSeverityHex(intensity) {
      if (intensity <= 3) return SEVERITY_COLORS.low;
      if (intensity <= 6) return SEVERITY_COLORS.medium;
      if (intensity <= 8) return SEVERITY_COLORS.high;
      return SEVERITY_COLORS.critical;
    }

    // Exposed methods for Android Kotlin Bridge
    window.setToolMode = function(mode) {
      toolMode = mode;
      controls.enabled = (mode === 'ROTATE');
    };

    window.setBrushIntensity = function(val) {
      brushIntensity = parseInt(val) || 5;
    };

    window.setCameraPreset = function(preset) {
      if (preset === 'front') {
        camera.position.set(0, 0.9, 2.2);
      } else if (preset === 'back') {
        camera.position.set(0, 0.9, -2.2);
      } else if (preset === 'left') {
        camera.position.set(-2.2, 0.9, 0);
      } else if (preset === 'right') {
        camera.position.set(2.2, 0.9, 0);
      } else {
        camera.position.set(0, 0.9, 2.2);
      }
      controls.target.set(0, 0.85, 0);
      controls.update();
    };

    window.syncPainPoints = function(pointsJson) {
      try {
        const points = JSON.parse(pointsJson);
        activePainMap = {};
        points.forEach(p => {
          activePainMap[p.region] = p.intensity;
        });
        updateMeshHighlights();
      } catch (e) {
        console.error('Failed to sync pain points', e);
      }
    };

    function hideLoading() {
      const loader = document.getElementById('loading-overlay');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 300);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
